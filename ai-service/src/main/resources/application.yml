server:
  port: 8085
spring:
  application:
    name: ai-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aidb}
    username: ${DB_USER:resumeai}
    password: ${DB_PASS:resumeai}
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
  flyway: { enabled: true, baseline-on-migrate: true }
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
app:
  ai:
    gateway-url: ${AI_GATEWAY_URL:https://ai.gateway.lovable.dev/v1/chat/completions}
    api-key: ${LOVABLE_API_KEY:${OPENAI_API_KEY:}}
    model: ${AI_MODEL:google/gemini-3-flash-preview}
