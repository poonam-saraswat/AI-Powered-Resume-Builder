server:
  port: 8081

spring:
  main:
    allow-circular-references: true
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resumeai_auth}
    username: ${DB_USER:resumeai}
    password: ${DB_PASS:resumeai}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 869635758-4ojuvhb3l679uu8g458c2jvhb4esqijr.apps.googleusercontent.com
            client-secret: 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
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
        provider:
          google:
            issuer-uri: https://accounts.google.com


          github:
            client-id: Ov23liqXl6uddTwBuWaK
            client-secret: cbab590b6b9ac61ae6f8f87df22eba87ff4d2657
            scope: read:user,user:email

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-only-for-dev}
    access-ttl-seconds: 3600
    refresh-ttl-seconds: 1209600
  frontend:
    redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:4200/oauth/callback}
