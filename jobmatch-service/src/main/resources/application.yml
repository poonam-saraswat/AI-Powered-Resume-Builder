server:
  port: 8087
spring:
  application:
    name: jobmatch-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobmatchdb}
    username: ${DB_USER:resumeai}
    password: ${DB_PASS:resumeai}
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
  flyway: { enabled: true, baseline-on-migrate: true }
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
jsearch:
  api-key: ${JSEARCH_API_KEY:}
  host: jsearch.p.rapidapi.com
